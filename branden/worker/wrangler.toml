name = "eng-ko-translator-proxy"
main = "index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Must match the deployed Worker URL — used for Stripe success/cancel/return URLs.
PUBLIC_BASE_URL = "https://eng-ko-translator-proxy.mwmw77.workers.dev"

# OAuth client ID from Google Cloud Console (type: Chrome Extension).
# Not a secret — it ships in the extension manifest — but the Worker MUST
# check incoming tokens against it, or any Google app's token would pass.
# Must be byte-identical to the client_id in the extension's manifest.json.
GOOGLE_CLIENT_ID = "80444110330-c8dotafh7rmopq576bllubjqg69inffj.apps.googleusercontent.com"

# One-time Pro Unlock $3. Not a secret — it identifies a price, it does not
# authorize anything — so it lives here where a deploy is reproducible rather
# than in an unreviewable secret. The live-mode Price is a different id; swap
# this when cutting over.
STRIPE_PRICE_ID = "price_1UARX7AFgSt5HQHAZdwbPvD1"

# License records. Create with:
#   npx wrangler kv namespace create LICENSES
# then paste the returned id below.
[[kv_namespaces]]
binding = "LICENSES"
id = "edf6a884eff441e4b36285c92263ec8a"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter"]

[[migrations]]
tag = "v2"
deleted_classes = ["UsageCounter"]

# Secrets — set via CLI, never in this file:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
