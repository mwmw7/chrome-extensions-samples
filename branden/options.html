<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings — English to Korean Translator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        font-size: 14px;
        color: #1a1a1a;
        background: #fafafa;
        display: flex;
        justify-content: center;
        padding: 40px 16px;
      }

      .container {
        width: 100%;
        max-width: 420px;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 24px;
      }

      h2 {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 12px;
        padding-top: 20px;
        border-top: 1px solid #eee;
      }

      h2:first-of-type {
        border-top: none;
        padding-top: 0;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
        font-size: 12px;
        color: #555;
      }

      .hint {
        font-size: 11px;
        color: #888;
        margin-bottom: 8px;
      }

      input[type='password'],
      input[type='text'],
      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 13px;
        margin-bottom: 14px;
        background: #fff;
      }

      /* Mode toggle */
      .mode-group {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }

      .mode-option {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 12px 0;
        border: 2px solid #ddd;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: #666;
        background: #fff;
        transition: all 0.15s;
      }

      .mode-option:hover {
        border-color: #aaa;
      }

      .mode-option.selected {
        border-color: #7c3aed;
        color: #7c3aed;
        background: #f5f3ff;
      }

      .mode-option input[type='radio'] {
        display: none;
      }

      .mode-pro-badge {
        font-size: 9px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 4px;
        background: #7c3aed;
        color: #fff;
        text-transform: uppercase;
      }

      .hidden {
        display: none !important;
      }

      .btn-hint {
        font-size: 11px;
        color: #999;
        text-align: center;
        margin: -4px 0 12px;
      }

      #account-links {
        margin-top: 14px;
        text-align: center;
        font-size: 12px;
      }

      #account-links a {
        color: #888;
        text-decoration: none;
      }

      #account-links a:hover {
        color: #555;
        text-decoration: underline;
      }

      #account-links .sep {
        color: #ccc;
        margin: 0 6px;
      }

      #plan-box {
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 12px;
        background: #fafafa;
      }

      #plan-tier {
        font-size: 14px;
        font-weight: 700;
        color: #7c3aed;
      }

      .primary-btn,
      .secondary-btn {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 8px;
      }

      .primary-btn {
        background: #7c3aed;
        color: #fff;
        border: none;
      }

      .primary-btn:hover {
        background: #6d28d9;
      }

      .secondary-btn {
        background: #fff;
        color: #555;
        border: 1px solid #ddd;
      }

      .key-row {
        display: flex;
        gap: 8px;
      }

      .key-row input {
        flex: 1;
      }



      .provider-group {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }

      .provider-option {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px 0;
        border: 2px solid #ddd;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: #666;
        background: #fff;
        transition: all 0.15s;
      }

      .provider-option:hover {
        border-color: #aaa;
      }

      .provider-option.selected {
        border-color: #2563eb;
        color: #2563eb;
        background: #eff6ff;
      }

      .provider-option input[type='radio'] {
        display: none;
      }

      .key-section {
        display: none;
      }

      .key-section.visible {
        display: block;
      }

      button {
        padding: 8px 20px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }

      button:hover {
        background: #1d4ed8;
      }

      #status {
        margin-top: 12px;
        font-size: 12px;
        color: #16a34a;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Settings</h1>

      <!-- Pro mode section -->
      <div id="pro-section">
        <div id="plan-box">
          <div id="plan-tier">Free</div>
          <div id="plan-account" class="hint">로그인되지 않음</div>
          <div id="plan-usage" class="hint">사용량 확인 중...</div>
        </div>

        <!-- Exactly one primary action is ever visible. Signing in is a step
             inside subscribing, not a competing button. -->
        <button id="upgrade-btn" class="primary-btn">Pro 구독하기</button>
        <div id="upgrade-hint" class="btn-hint">
          $3 한 번 결제로 저장 무제한·복습·내보내기가 열립니다. AI 사용료는
          본인 API 키로 별도 청구됩니다.
        </div>

        <div id="account-links">
          <a href="#" id="signin-link">Google 로그인</a>
          <a href="#" id="signout-link" class="hidden">로그아웃</a>
          <span class="sep">&middot;</span>
          <a href="#" id="refresh-link">새로고침</a>
        </div>
      </div>

      <!-- Own Key sections -->
      <div id="own-key-sections">
        <!-- AI Provider -->
        <h2>AI Provider</h2>
        <div class="hint">
          Choose which AI to use for word details (grammar, idioms, examples).
          Basic translations always use Google Translate.
        </div>
        <div class="provider-group">
          <label class="provider-option" data-provider="claude">
            <input type="radio" name="provider" value="claude" />
            Claude
          </label>
          <label class="provider-option selected" data-provider="gemini">
            <input type="radio" name="provider" value="gemini" checked />
            Gemini
          </label>
          <label class="provider-option" data-provider="openai">
            <input type="radio" name="provider" value="openai" />
            OpenAI
          </label>
        </div>

        <!-- Claude section -->
        <div class="key-section" id="claude-section">
          <h2>Claude</h2>
          <label for="claude-key-input">API Key</label>
          <input
            type="password"
            id="claude-key-input"
            placeholder="sk-ant-..."
          />

          <label for="claude-model-select">Model</label>
          <select id="claude-model-select">
            <option value="claude-haiku-4-5-20251001">Haiku 4.5 (Fast)</option>
            <option value="claude-sonnet-4-5-20250929">
              Sonnet 4.5 (Balanced)
            </option>
            <option value="claude-sonnet-4-6">Sonnet 4.6 (Latest)</option>
          </select>
        </div>

        <!-- Gemini section -->
        <div class="key-section visible" id="gemini-section">
          <h2>Gemini</h2>
          <label for="gemini-key-input">API Key</label>
          <input type="password" id="gemini-key-input" placeholder="AIza..." />

          <label for="gemini-model-select">Model</label>
          <select id="gemini-model-select">
            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
            <option value="gemini-2.0-flash">gemini-2.0-flash</option>
          </select>
        </div>

        <!-- OpenAI section -->
        <div class="key-section" id="openai-section">
          <h2>OpenAI</h2>
          <label for="openai-key-input">API Key</label>
          <input type="password" id="openai-key-input" placeholder="sk-..." />

          <label for="openai-model-select">Model</label>
          <select id="openai-model-select">
            <option value="gpt-4.1-mini">GPT-4.1 Mini (Fast)</option>
            <option value="gpt-4.1-nano">GPT-4.1 Nano (Fastest)</option>
            <option value="gpt-4.1">GPT-4.1</option>
            <option value="gpt-4o">GPT-4o</option>
          </select>
        </div>
      </div>
      <!-- /own-key-sections -->

      <button id="save-btn">Save</button>
      <div id="status"></div>

    </div>

    <script src="options.js"></script>
  </body>
</html>
